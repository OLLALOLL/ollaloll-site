<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timetable">
  <title>9D Timetable</title>
  <link rel="manifest" href="/admin/tt/manifest.webmanifest">
  <link rel="icon" href="/admin/tt/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/admin/tt/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0a1a; --ink: #efeafc; --muted: #aca5c7; --line: rgba(255,255,255,.1);
      --glass: rgba(255,255,255,.045); --glass2: rgba(255,255,255,.09);
      --v2: #a78bfa; --v3: #c9b8ff; --grad: linear-gradient(135deg,#9a78ff,#c7a6ff);
      --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --disp: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: var(--font); font-size: 16px; line-height: 1.4;
      background-image: radial-gradient(900px 420px at 80% -10%, rgba(139,92,246,.22), transparent 70%);
      background-repeat: no-repeat;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .app { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
    header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-family: var(--disp); font-weight: 600; font-size: 1.5rem; margin: 0; letter-spacing: -.01em; }
    h1 small { display: block; font-family: var(--font); font-weight: 500; font-size: .8rem; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
    .icon-btn { min-width: 44px; height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); font-weight: 600; font-size: .9rem; }

    .weekbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .weekbar .nav { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); font-size: 1.2rem; }
    .weekbar .title { flex: 1; text-align: center; min-width: 0; }
    .weekbar .title b { display: inline-block; padding: 2px 12px; border-radius: 99px; background: var(--grad); color: #1a1030; font-weight: 700; margin-right: 6px; }
    .weekbar .title span { color: var(--muted); font-size: .95rem; }
    .row2 { display: flex; gap: 8px; margin-bottom: 14px; }
    [hidden] { display: none !important; }
    .backbtn { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); font-weight: 600; }
    .nowtag { margin-top: 4px; border: 1px solid rgba(201,184,255,.45); background: rgba(139,92,246,.18); color: var(--v3); border-radius: 99px; padding: 3px 12px; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; min-height: 26px; }
    .nowtag.btn { background: var(--grad); color: #1a1030; border-color: transparent; min-height: 34px; padding: 5px 14px; }
    .nowmark { display: flex; align-items: center; gap: 8px; color: var(--v3); font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: -2px 0; }
    .nowmark::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--v3); box-shadow: 0 0 10px var(--v2); }
    .nowmark::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--v3), transparent); }
    .seg { display: flex; flex: 1; border: 1px solid var(--line); border-radius: 14px; background: var(--glass); padding: 3px; gap: 3px; }
    .seg button { flex: 1; min-height: 38px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font-weight: 600; font-size: .9rem; }
    .seg button[aria-pressed="true"] { background: var(--glass2); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(201,184,255,.35); }

    .days[hidden] { display: none; }
    .days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
    .days button { min-height: 58px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; position: relative; }
    .days button b { font-size: .95rem; }
    .days button span { font-size: .78rem; color: var(--muted); }
    .days button[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: #1a1030; }
    .days button[aria-pressed="true"] span { color: #3a2a63; }
    .days button.today::after { content: ""; position: absolute; top: 6px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--v2); }
    .days button.today[aria-pressed="true"]::after { background: #1a1030; }

    .status { border-radius: 16px; border: 1px solid rgba(201,184,255,.35); background: linear-gradient(135deg, rgba(139,92,246,.22), rgba(139,92,246,.08)); padding: 12px 14px; margin-bottom: 14px; }
    .status .k { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--v3); font-weight: 700; }
    .status .v { font-weight: 600; margin-top: 2px; }
    .status .bar { height: 5px; border-radius: 9px; background: rgba(255,255,255,.12); margin-top: 8px; overflow: hidden; }
    .status .bar i { display: block; height: 100%; background: var(--grad); border-radius: 9px; }
    .banner { width: 100%; text-align: left; border: 1px dashed rgba(201,184,255,.5); background: var(--glass); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; font-weight: 600; }
    .banner small { display: block; font-weight: 400; color: var(--muted); }

    .list { display: grid; gap: 10px; }
    .lesson { --c: #a78bfa; width: 100%; text-align: left; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px 12px 12px; border-radius: 16px; border: 1px solid var(--line); border-left: 5px solid var(--c); background: color-mix(in srgb, var(--c) 14%, rgba(255,255,255,.03)); min-height: 64px; }
    .lesson .t { font-size: .85rem; color: var(--muted); line-height: 1.25; font-variant-numeric: tabular-nums; }
    .lesson .t b { color: var(--ink); display: block; font-size: .95rem; }
    .lesson .n { min-width: 0; }
    .lesson .n strong { display: block; font-size: 1.05rem; overflow-wrap: anywhere; }
    .lesson .n em { display: block; font-style: normal; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
    .lesson .r { font-weight: 700; font-size: .95rem; padding: 4px 10px; border-radius: 10px; background: rgba(0,0,0,.28); white-space: nowrap; }
    .lesson .r.pick { color: var(--v3); font-weight: 600; font-size: .8rem; }
    .lesson.now { box-shadow: 0 0 0 2px var(--v3), 0 0 24px rgba(167,139,250,.35); }
    .lesson.past { opacity: .55; }
    .empty { text-align: center; color: var(--muted); padding: 32px 12px; border: 1px dashed var(--line); border-radius: 16px; }

    html.lock, html.lock body { overflow: hidden; height: 100%; overscroll-behavior: none; position: relative; }
    html { overscroll-behavior-y: none; }
    .gridwrap { position: relative; }
    .daybar { position: absolute; z-index: 0; border-radius: 14px; background: linear-gradient(90deg, rgba(139,92,246,.22), rgba(139,92,246,.1)); box-shadow: inset 0 0 0 1px rgba(201,184,255,.28); pointer-events: none; }
    .timeline { position: absolute; z-index: 3; width: 3px; margin-left: -1.5px; border-radius: 3px; background: #ff7a93; box-shadow: 0 0 10px rgba(255,122,147,.8); pointer-events: none; }
    .timeline span { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 2px; padding: 1px 6px; border-radius: 99px; background: #ff7a93; color: #2a0612; font-size: .65rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .timeline::before { content: ""; position: absolute; left: 50%; top: -3px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: #ff7a93; }
    .grid > * { position: relative; z-index: 1; }
    .grid { display: grid; grid-template-columns: 44px repeat(4, minmax(0, 1fr)); gap: 4px; }
    .grid .h { text-align: center; font-size: .7rem; color: var(--muted); padding: 4px 0; font-weight: 600; line-height: 1.2; }
    .grid .h b { display: block; color: var(--ink); font-size: .9rem; }
    .grid .h small { font-size: .6rem; font-weight: 500; }
    .grid .h.today { color: var(--v3); }
    .grid button.p { background: none; border: 0; padding: 0 0 0 2px; font: inherit; border-radius: 10px; }
    .grid .p.today { color: var(--v3); }
    .grid .p.today b::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--v3); margin-left: 6px; vertical-align: middle; box-shadow: 0 0 8px var(--v2); }
    .grid .h.cur { color: var(--v3); }
    .grid .h.corner b { background: var(--grad); color: #1a1030; border-radius: 12px; width: 34px; height: 34px; line-height: 34px; margin: 0 auto 2px; font-size: 1.2rem; }
    .grid .h.corner small { font-size: .6rem; text-transform: uppercase; letter-spacing: .06em; }
    .grid .h.cur b { color: var(--v3); }
    .grid .h.cur small { color: var(--v3); }
    .sheet { overscroll-behavior: contain; touch-action: pan-y; }
    .grid .p { font-size: .7rem; color: var(--muted); display: flex; flex-direction: column; justify-content: center; text-align: left; padding-left: 2px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .grid .p b { color: var(--ink); font-size: .9rem; }
    .grid .p.today b { color: var(--v3); }
    .cell { --c: #a78bfa; min-height: 62px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--c) 22%, transparent); background: color-mix(in srgb, var(--c) 16%, rgba(255,255,255,.03)); padding: 4px 2px; font-size: .78rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; overflow: hidden; min-width: 0; }
    .cell small { font-weight: 500; color: var(--muted); font-size: .66rem; }
    .cell.blank { background: transparent; border: 1px dashed rgba(255,255,255,.06); cursor: default; }
    .cell.now { box-shadow: 0 0 0 2px var(--v3); }

    .backdrop { position: fixed; inset: 0; background: rgba(5,3,12,.65); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 20; }
    .backdrop.on { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 520px; margin: 0 auto; max-height: 86vh; overflow: auto; border-radius: 24px 24px 0 0; background: #17122a; border: 1px solid var(--line); border-bottom: 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .22s ease; }
    .sheet.on { transform: none; }
    .sheet .grab { width: 44px; height: 5px; border-radius: 4px; background: rgba(255,255,255,.25); margin: -6px auto 12px; position: relative; }
    .sheet .grab::after { content: ""; position: absolute; inset: -14px -40px; }
    .sheet h2 { margin: 0; font-family: var(--disp); font-weight: 600; font-size: 1.25rem; overflow-wrap: anywhere; }
    .sheet .code { color: var(--muted); font-size: .9rem; margin: 2px 0 14px; }
    .facts { display: grid; gap: 8px; margin-bottom: 14px; }
    .fact { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 11px 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); }
    .fact span { color: var(--muted); font-size: .85rem; }
    .fact b { overflow-wrap: anywhere; }
    .sheet h3 { margin: 16px 0 8px; font-size: .85rem; text-transform: uppercase; letter-spacing: .07em; color: var(--v3); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { min-height: 44px; padding: 6px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); font-weight: 600; text-align: left; }
    .chip small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
    .chip[aria-pressed="true"] { border-color: var(--v3); background: rgba(139,92,246,.28); }
    .close { width: 100%; margin-top: 16px; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass2); font-weight: 600; }
    .foot { margin-top: 22px; text-align: center; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>9D<small id="clock">Timetable</small></h1>
      <button class="icon-btn" id="lang" type="button" aria-label="Language"></button>
    </header>

    <div class="weekbar">
      <button class="nav" id="prev" type="button">‹</button>
      <div class="title"><div><b id="wk-letter">A</b><span id="wk-range"></span></div><button class="nowtag" id="wk-now" type="button"></button></div>
      <button class="nav" id="next" type="button">›</button>
    </div>

    <div class="row2" id="row2" hidden>
      <button class="backbtn" id="back" type="button"></button>
    </div>

    <div class="days" id="days"></div>
    <div id="status"></div>
        <div id="out"></div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <script>
  (function () {
    "use strict";

    /* ---------- data ---------- */
    var PERIODS = {
      1: ["09:00", "10:20"], 2: ["10:30", "11:50"], 3: ["12:35", "13:55"], 4: ["14:05", "15:25"]
    };
    var TX = {
      en: {
        dayn: ["Mon", "Tue", "Wed", "Thu", "Fri"],
        dayfull: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        daysun: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
        mon: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
        title: "9D Timetable", back: "‹ Back to week", prev: "Previous week", next: "Next week",
        week: "Week", weekLow: "week", thisWeek: "This week", backThis: "Back to this week",
        now: "Now", nextK: "Next", today: "Today", done: "Done for today",
        ends: function (n) { return "ends in " + n + " min"; }, nextAt: function (a, t) { return "Next: " + a + " at " + t; },
        teacher: "Teacher", room: "Classroom", time: "Time", day: "Day", period: "period",
        dep: "Depends on your group", nolist: "Not listed", pickG: "pick group", pick: "pick",
        choose: "Choose your group", change: "Change your group", close: "Close", open: "Open", group: "group", lang: "ET"
      },
      et: {
        dayn: ["Es", "Te", "Ko", "Ne", "Re"],
        dayfull: ["Esmaspäev", "Teisipäev", "Kolmapäev", "Neljapäev", "Reede"],
        daysun: ["Pü", "Es", "Te", "Ko", "Ne", "Re", "La"],
        mon: ["jaan", "veebr", "märts", "apr", "mai", "juuni", "juuli", "aug", "sept", "okt", "nov", "dets"],
        title: "9D tunniplaan", back: "‹ Tagasi nädalale", prev: "Eelmine nädal", next: "Järgmine nädal",
        week: "Nädal", weekLow: "nädal", thisWeek: "See nädal", backThis: "Tagasi sellele nädalale",
        now: "Praegu", nextK: "Järgmine", today: "Täna", done: "Tänaseks läbi",
        ends: function (n) { return "lõpeb " + n + " min pärast"; }, nextAt: function (a, t) { return "Järgmine: " + a + " kell " + t; },
        teacher: "Õpetaja", room: "Klassiruum", time: "Aeg", day: "Päev", period: "tund",
        dep: "Sõltub sinu rühmast", nolist: "Pole märgitud", pickG: "vali rühm", pick: "vali",
        choose: "Vali oma rühm", change: "Muuda oma rühma", close: "Sulge", open: "Ava", group: "rühm", lang: "EN"
      }
    };
    var LANG = (function () {
      var v = null; try { v = JSON.parse(localStorage.getItem("tt-lang")); } catch (e) {}
      if (v === "en" || v === "et") return v;
      return /^et/i.test(navigator.language || "") ? "et" : "en";
    })();
    function tr(k) { return TX[LANG][k]; }
    var DAYN, DAYFULL, MON;
    function sname(code) {
      if (LANG === "en") return S[code][1];
      var n = S[code][2]; return n.charAt(0).toUpperCase() + n.slice(1);
    }

    // code, English name, Estonian name, colour
    var S = {
      kj:     ["kj", "Class teacher's hour", "klassijuhatajatund", "#f0a0a0"],
      mat:    ["mat", "Mathematics", "matemaatika", "#b5d89a"],
      mu:     ["mu", "Music", "muusika", "#f7b6b6"],
      ek:     ["ek", "Estonian language", "eesti keel", "#bdbdf0"],
      kirj:   ["kirj", "Literature", "kirjandus", "#d6b4f0"],
      keemia: ["keemia", "Chemistry", "keemia", "#e57f7f"],
      bio:    ["bio", "Biology", "bioloogia", "#8fcf8f"],
      geo:    ["geo", "Geography", "geograafia", "#d0a6f0"],
      aj:     ["aj", "History", "ajalugu", "#b9f08c"],
      f:      ["f", "Physics", "füüsika", "#8a8af0"],
      "ühisk": ["ühisk", "Social studies", "ühiskonnaõpetus", "#e56fb0"],
      koor:   ["koor", "Choir", "koor", "#aeaef5"],
      ika:    ["ika", "English", "inglise keel A", "#e0a070"],
      vkb:    ["vkb", "Russian", "vene keel B", "#7fd096"],
      skb:    ["skb", "German", "saksa keel B", "#f0b070"],
      kk:     ["kk", "Physical education", "kehaline kasvatus", "#c98a8a"],
      "käs":  ["käs", "Handicraft", "käsitöö", "#d6d58a"],
      teh:    ["teh", "Technology", "tehnoloogiaõpetus", "#90bfef"],
      b2:     ["vkb / skb", "Second language (Russian or German)", "vene / saksa keel B", "#7fd096"],
      kt:     ["käs-tehn", "Handicraft and technology", "käsitöö ja tehnoloogia", "#d6d58a"]
    };

    // split-group families: [group, subject, teacher, default room]
    var FAM = {
      mat: { name: "Mathematics", s: "mat", g: [
        ["mat1", "mat", "Lepik", "C307"], ["mat2", "mat", "Vetevool", "C305"], ["mat3", "mat", "Saarepuu", "C304"],
        ["mat4", "mat", "Kivi", "C241"], ["mat5", "mat", "Kiis", "C115"] ] },
      ika: { name: "English (ika)", s: "ika", g: [
        ["IK1", "ika", "Kivik", "C161"], ["IK2", "ika", "Mällik", "C155"], ["IK3", "ika", "Kukk", "C233"],
        ["IK4", "ika", "Altenberg", "C129"], ["IK5", "ika", "Kõdre", "C155"], ["IK6", "ika", "Kolbi", "C131"] ] },
      b2: { name: "Russian / German (vkb / skb)", s: "b2", g: [
        ["VK1", "vkb", "Peltonov", "C233"], ["VK2", "vkb", "Nerada", "C115"], ["VK3", "vkb", "Pobjartina", "C125"],
        ["VK4", "vkb", "Reimann", "C139"], ["SK1", "skb", "Keskla", "C202"], ["SK2", "skb", "Tiitsepere", "C125"] ] },
      kk: { name: "Physical education (kk)", s: "kk", g: [
        ["T1", "kk", "Rünne", "D0"], ["P1", "kk", "Porkveli", "D101-1"] ] },
      kt: { name: "Handicraft / technology", s: "kt", g: [
        ["käs", "käs", "Nahkur", "C104"], ["teh", "teh", "Kobrusepp", "C148"] ] }
    };

    function L(p, s, room, teacher) { return { p: p, s: s, r: room, t: teacher || null }; }
    function G(p, fam, ov) { return { p: p, fam: fam, ov: ov || {} }; }

    var T = {
      A: [
        [L(1, "kj", "C311", "Kivi"), G(2, "mat"), L(3, "mu", "B217", "Kalvet A."), G(4, "kt")],
        [L(1, "ek", "C241", "Pappel T."), G(2, "mat", { mat5: "C302" })],
        [L(1, "keemia", "C222", "Pilter K."), L(2, "kirj", "C241", "Pappel T."), L(3, "bio", "C214", "Heinsalu"), G(4, "ika")],
        [L(1, "ek", "C241", "Pappel T."), L(2, "geo", "C204", "Ojassalu"), G(3, "kk"), G(4, "b2")],
        [L(1, "ühisk", "C223"), L(2, "aj", "C229"), L(3, "f", "C210"), G(4, "b2")]
      ],
      B: [
        [L(1, "keemia", "C222", "Pilter K."), G(2, "mat")],
        [L(1, "ek", "C241", "Pappel T."), G(2, "mat", { mat5: "C302" }), G(3, "ika")],
        [G(1, "mat", { mat4: "C222", mat5: "C302" }), L(2, "kirj", "C241", "Pappel T."), L(3, "bio", "C214", "Heinsalu"), G(4, "ika")],
        [L(2, "geo", "C204", "Ojassalu"), G(3, "kk"), G(4, "b2")],
        [L(1, "ühisk", "C223"), L(2, "aj", "C229"), L(3, "f", "C210")]
      ]
    };

    /* ---------- state / storage ---------- */
    function load(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

    var groups = load("tt-groups", {});
    var view = "week";                         // week | day
    var offset = 0;
    var sel = 0;

    /* ---------- date helpers ---------- */
    var BASE = Date.UTC(2026, 10, 2); // Monday of a week A
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function mins(hm) { var a = hm.split(":"); return +a[0] * 60 + +a[1]; }
    function mondayOf(now) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var dow = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - dow + (dow > 4 ? 7 : 0));
      return d;
    }
    function weekIndex(mon) { return Math.round((Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate()) - BASE) / (7 * 864e5)); }
    function autoLetter(mon) { return ((weekIndex(mon) % 2) + 2) % 2 === 0 ? "A" : "B"; }

    /* ---------- lesson resolution ---------- */
    function resolve(l) {
      if (l.s) return { p: l.p, s: l.s, room: l.r, teacher: l.t, group: null, fam: null };
      var f = FAM[l.fam], pick = groups[l.fam];
      for (var i = 0; i < f.g.length; i++) {
        var g = f.g[i];
        if (g[0] === pick) {
          return { p: l.p, s: g[1], room: l.ov[g[0]] || g[3], teacher: g[2], group: g[0], fam: l.fam };
        }
      }
      return { p: l.p, s: f.s, room: null, teacher: null, group: null, fam: l.fam, unpicked: true };
    }

    /* ---------- DOM helpers ---------- */
    function $(id) { return document.getElementById(id); }
    function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function colour(s) { return S[s][3]; }

    /* ---------- render ---------- */
    var now = new Date();
    var monday = mondayOf(now);
    var todayIdx = (function () { var d = (now.getDay() + 6) % 7; return d > 4 ? -1 : d; })();
    sel = todayIdx < 0 ? 0 : todayIdx;

    function shownMonday() { var m = new Date(monday); m.setDate(m.getDate() + offset * 7); return m; }
    function dayDate(i) { var m = shownMonday(); m.setDate(m.getDate() + i); return m; }
    function curLetter() { return autoLetter(shownMonday()); }
    function isTodayShown(i) { return offset === 0 && i === todayIdx; }

    function nowMin() { var n = new Date(); return n.getHours() * 60 + n.getMinutes(); }

    function render() {
      var letter = curLetter();
      $("wk-letter").textContent = tr("week") + " " + letter;
      $("wk-letter").hidden = view === "week";
      var a = dayDate(0), b = dayDate(4);
      $("wk-range").textContent = a.getDate() + (a.getMonth() === b.getMonth() ? "" : " " + MON[a.getMonth()]) + " – " + b.getDate() + " " + MON[b.getMonth()];
      var tag = $("wk-now");
      if (offset === 0) { tag.textContent = tr("thisWeek"); tag.className = "nowtag"; tag.disabled = true; }
      else { tag.textContent = tr("backThis"); tag.className = "nowtag btn"; tag.disabled = false; }
      var nw = new Date();
      $("clock").textContent = TX[LANG].daysun[nw.getDay()] + " " + nw.getDate() + " " + MON[nw.getMonth()] + " · " + pad(nw.getHours()) + ":" + pad(nw.getMinutes());
      $("row2").hidden = view === "week";
      document.documentElement.classList.toggle("lock", view === "week");
      if (view === "week") window.scrollTo(0, 0);

      // day tabs
      var days = $("days"); days.textContent = "";
      days.hidden = view === "week";
      for (var i = 0; i < 5; i++) {
        (function (i) {
          var btn = h("button", isTodayShown(i) ? "today" : "");
          btn.type = "button";
          btn.setAttribute("aria-pressed", String(i === sel));
          btn.appendChild(h("b", null, DAYN[i]));
          btn.appendChild(h("span", null, String(dayDate(i).getDate())));
          btn.addEventListener("click", function () { sel = i; render(); });
          days.appendChild(btn);
        })(i);
      }

      var out = $("out"); out.textContent = "";
      if (view === "week") { $("status").textContent = ""; renderWeek(out, letter); }
      else { renderStatus(letter); renderDay(out, letter); }

    }

    function renderStatus(letter) {
      var box = $("status"); box.textContent = "";
      if (!isTodayShown(sel)) return;
      var lessons = T[letter][sel].map(resolve);
      var n = nowMin(), cur = null, next = null;
      lessons.forEach(function (x) {
        var st = mins(PERIODS[x.p][0]), en = mins(PERIODS[x.p][1]);
        if (n >= st && n < en) cur = x; else if (n < st && !next) next = x;
      });
      if (!cur && !next && lessons.length === 0) return;
      var card = h("div", "status");
      function name(x) { return sname(x.s); }
      if (cur) {
        var en = mins(PERIODS[cur.p][1]), st = mins(PERIODS[cur.p][0]);
        card.appendChild(h("div", "k", tr("now")));
        card.appendChild(h("div", "v", name(cur) + (cur.room ? " · " + cur.room : "") + " · " + tr("ends")(en - n)));
        var bar = h("div", "bar"), i = h("i"); i.style.width = Math.round((n - st) / (en - st) * 100) + "%";
        bar.appendChild(i); card.appendChild(bar);
        if (next) {
          var nx = h("div", "k", tr("nextAt")(name(next), PERIODS[next.p][0]));
          nx.style.marginTop = "8px";
          card.appendChild(nx);
        }
      } else if (next) {
        card.appendChild(h("div", "k", tr("nextK")));
        card.appendChild(h("div", "v", name(next) + (next.room ? " · " + next.room : "") + " · " + PERIODS[next.p][0]));
      } else {
        card.appendChild(h("div", "k", tr("today")));
        card.appendChild(h("div", "v", tr("done")));
      }
      box.appendChild(card);
    }

    function renderDay(out, letter) {
      var lessons = T[letter][sel];
      if (!lessons.length) { out.appendChild(h("div", "empty", "No lessons")); return; }
      var list = h("div", "list");
      var n = nowMin();
      var marked = !isTodayShown(sel);
      function mark() { if (marked) return; marked = true; list.appendChild(h("div", "nowmark", pad(new Date().getHours()) + ":" + pad(new Date().getMinutes()))); }
      lessons.forEach(function (raw) {
        var x = resolve(raw);
        var st = PERIODS[x.p][0], en = PERIODS[x.p][1];
        if (!marked && n < mins(st)) mark();
        if (!marked && n >= mins(st) && n < mins(en)) marked = true;
        var btn = h("button", "lesson");
        btn.type = "button";
        btn.style.setProperty("--c", colour(x.s));
        if (isTodayShown(sel)) {
          if (n >= mins(st) && n < mins(en)) btn.classList.add("now");
          else if (n >= mins(en)) btn.classList.add("past");
        }
        var t = h("div", "t"); t.appendChild(h("b", null, st)); t.appendChild(document.createTextNode(en));
        var nm = h("div", "n"); nm.appendChild(h("strong", null, sname(x.s)));
        nm.appendChild(h("em", null, x.group ? S[x.s][0] + " · " + x.group : S[x.s][0]));
        var r = h("div", x.unpicked ? "r pick" : "r", x.unpicked ? tr("pickG") : (x.room || "–"));
        btn.appendChild(t); btn.appendChild(nm); btn.appendChild(r);
        btn.addEventListener("click", function () { openLesson(raw, sel); });
        list.appendChild(btn);
      });
      mark();
      out.appendChild(list);
    }

    function renderWeek(out, letter) {
      var wrap = h("div", "gridwrap");
      var grid = h("div", "grid");
      var slots = {}, labels = {};
      var n = nowMin();
      var corner = h("div", "h corner"); corner.appendChild(h("b", null, letter)); corner.appendChild(h("small", null, tr("weekLow")));
      grid.appendChild(corner);
      for (var p = 1; p <= 4; p++) {
        var live = offset === 0 && todayIdx >= 0 && n >= mins(PERIODS[p][0]) && n < mins(PERIODS[p][1]);
        var ph = h("div", "h" + (live ? " cur" : "")); ph.appendChild(h("b", null, String(p))); ph.appendChild(h("small", null, PERIODS[p][0] + "–" + PERIODS[p][1]));
        grid.appendChild(ph);
      }
      for (var d = 0; d < 5; d++) {
        (function (d) {
          var dc = h("button", "p" + (isTodayShown(d) ? " today" : ""));
          dc.type = "button";
          dc.setAttribute("aria-label", tr("open") + " " + DAYFULL[d]);
          dc.appendChild(h("b", null, DAYN[d])); dc.appendChild(document.createTextNode(String(dayDate(d).getDate())));
          dc.addEventListener("click", function () { openDay(d); });
          labels[d] = dc;
          grid.appendChild(dc);
        })(d);
        for (var pp = 1; pp <= 4; pp++) {
          (function (d, pp) {
            var raw = T[letter][d].filter(function (l) { return l.p === pp; })[0];
            if (!raw) { var bl = h("div", "cell blank"); slots[d + "_" + pp] = bl; grid.appendChild(bl); return; }
            var x = resolve(raw);
            var c = h("button", "cell");
            c.type = "button";
            c.style.setProperty("--c", colour(x.s));
            if (isTodayShown(d) && n >= mins(PERIODS[pp][0]) && n < mins(PERIODS[pp][1])) c.classList.add("now");
            c.appendChild(h("span", null, x.unpicked ? S[x.s][0].replace(" / ", "/") : S[x.s][0]));
            c.appendChild(h("small", null, x.room ? x.room.split(",")[0] : tr("pick")));
            c.addEventListener("click", function () { openLesson(raw, d); });
            slots[d + "_" + pp] = c;
            grid.appendChild(c);
          })(d, pp);
        }
      }
      wrap.appendChild(grid);
      out.appendChild(wrap);
      if (offset === 0 && todayIdx >= 0 && n >= 7 * 60 && n <= 17 * 60) placeNow(wrap, labels[todayIdx], slots, n);
    }

    // today's row band + live time line (like Edupage's red line)
    function placeNow(wrap, label, slots, n) {
      var W = wrap.getBoundingClientRect(), L = label.getBoundingClientRect();
      var top = L.top - W.top, hgt = L.height;
      var row = []; for (var p = 1; p <= 4; p++) row.push(slots[todayIdx + "_" + p].getBoundingClientRect());
      var bar = h("div", "daybar");
      bar.style.left = (L.left - W.left - 2) + "px"; bar.style.width = (W.width - (L.left - W.left) + 2) + "px";
      bar.style.top = (top - 3) + "px"; bar.style.height = (hgt + 6) + "px";
      wrap.insertBefore(bar, wrap.firstChild);
      var x = null;
      for (var i = 0; i < 4; i++) {
        var st = mins(PERIODS[i + 1][0]), en = mins(PERIODS[i + 1][1]);
        if (n >= st && n < en) { x = row[i].left + row[i].width * (n - st) / (en - st); break; }
        if (n < st) { x = i === 0 ? row[0].left - 2 : (row[i - 1].right + row[i].left) / 2; break; }
      }
      if (x === null) x = row[3].right + 2;
      var line = h("div", "timeline");
      line.style.left = (x - W.left) + "px"; line.style.top = (top - 2) + "px"; line.style.height = (hgt + 4) + "px";
      line.appendChild(h("span", null, pad(new Date().getHours()) + ":" + pad(new Date().getMinutes())));
      wrap.appendChild(line);
    }

    /* ---------- sheets ---------- */
    var sheet = $("sheet"), backdrop = $("backdrop");
    var sheetOpen = false, ignorePop = 0;
    function showSheet() {
      sheet.style.transform = ""; sheet.style.transition = "";
      sheet.classList.add("on"); backdrop.classList.add("on"); sheet.setAttribute("aria-hidden", "false");
    }
    function hideSheet() { sheet.style.transform = ""; sheet.style.transition = ""; sheet.classList.remove("on"); backdrop.classList.remove("on"); sheet.setAttribute("aria-hidden", "true"); }
    function openSheet() {
      if (!sheetOpen) { sheetOpen = true; try { history.pushState({ tt: "sheet" }, ""); } catch (e) {} }
      showSheet();
    }
    function closeSheet() {
      if (!sheetOpen) return;
      sheetOpen = false; hideSheet();
      ignorePop++; try { history.back(); } catch (e) { ignorePop--; }
    }
    function openDay(d) {
      sel = d; view = "day";
      try { history.pushState({ tt: "day" }, ""); } catch (e) {}
      render(); window.scrollTo(0, 0);
    }
    function closeDay() {
      if (view !== "day") return;
      view = "week"; ignorePop++;
      try { history.back(); } catch (e) { ignorePop--; }
      render();
    }
    window.addEventListener("popstate", function () {
      if (ignorePop > 0) { ignorePop--; return; }
      if (sheetOpen) { sheetOpen = false; hideSheet(); }
      else if (view === "day") { view = "week"; render(); }
    });
    backdrop.addEventListener("click", closeSheet);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

    // swipe down to dismiss
    (function () {
      var y0 = null, dy = 0, fromHandle = false, t0 = 0;
      sheet.addEventListener("touchstart", function (e) {
        var t = e.touches[0];
        fromHandle = t.clientY - sheet.getBoundingClientRect().top < 48;
        y0 = (sheet.scrollTop <= 0 || fromHandle) ? t.clientY : null; dy = 0; t0 = Date.now();
      }, { passive: true });
      sheet.addEventListener("touchmove", function (e) {
        if (y0 === null) return;
        dy = e.touches[0].clientY - y0;
        if (dy > 0) {
          e.preventDefault();
          sheet.style.transition = "none"; sheet.style.transform = "translateY(" + dy + "px)";
        } else { dy = 0; sheet.style.transform = ""; }
      }, { passive: false });
      function end() {
        if (y0 === null) return;
        var fast = dy > 40 && (Date.now() - t0) < 250;
        y0 = null;
        if (dy > 90 || fast) { closeSheet(); }
        else { sheet.style.transition = ""; sheet.style.transform = ""; }
        dy = 0;
      }
      sheet.addEventListener("touchend", end); sheet.addEventListener("touchcancel", end);
    })();

    function fact(label, value) {
      var f = h("div", "fact"); f.appendChild(h("span", null, label)); f.appendChild(h("b", null, value)); return f;
    }
    function groupChips(fam, onPick) {
      var chips = h("div", "chips");
      FAM[fam].g.forEach(function (g) {
        var c = h("button", "chip", g[0]);
        c.type = "button";
        c.appendChild(h("small", null, g[2] + " · " + sname(g[1])));
        c.setAttribute("aria-pressed", String(groups[fam] === g[0]));
        c.addEventListener("click", function () { groups[fam] = g[0]; save("tt-groups", groups); onPick(); });
        chips.appendChild(c);
      });
      return chips;
    }
    function closeBtn() { var b = h("button", "close", tr("close")); b.type = "button"; b.addEventListener("click", closeSheet); return b; }

    function openLesson(raw, dayIdx) {
      var x = resolve(raw);
      var s = S[x.s];
      sheet.textContent = "";
      sheet.appendChild(h("div", "grab"));
      sheet.appendChild(h("h2", null, sname(x.s)));
      sheet.appendChild(h("div", "code", s[0] + (LANG === "en" && s[2] && s[2] !== s[0] ? " · " + s[2] : "") + (x.group ? " · " + tr("group") + " " + x.group : "")));
      var facts = h("div", "facts");
      facts.appendChild(fact(tr("teacher"), x.teacher || (x.unpicked ? tr("dep") : tr("nolist"))));
      facts.appendChild(fact(tr("room"), x.room || (x.unpicked ? tr("dep") : "–")));
      facts.appendChild(fact(tr("time"), PERIODS[x.p][0] + " – " + PERIODS[x.p][1] + " (" + tr("period") + " " + x.p + ")"));
      facts.appendChild(fact(tr("day"), DAYFULL[dayIdx] + " " + dayDate(dayIdx).getDate() + " " + MON[dayDate(dayIdx).getMonth()]));
      sheet.appendChild(facts);
      if (raw.fam) {
        sheet.appendChild(h("h3", null, x.group ? tr("change") : tr("choose")));
        sheet.appendChild(groupChips(raw.fam, function () { render(); openLesson(raw, dayIdx); }));
      }
      sheet.appendChild(closeBtn());
      openSheet();
    }

    /* ---------- events ---------- */
    $("prev").addEventListener("click", function () { offset--; render(); });
    $("next").addEventListener("click", function () { offset++; render(); });
    $("wk-now").addEventListener("click", function () { offset = 0; render(); });
    $("back").addEventListener("click", closeDay);

    function applyLang() {
      var T_ = TX[LANG]; DAYN = T_.dayn; DAYFULL = T_.dayfull; MON = T_.mon;
      document.documentElement.lang = LANG;
      document.title = T_.title;
      $("lang").textContent = T_.lang;
      $("back").textContent = T_.back; $("prev").setAttribute("aria-label", T_.prev); $("next").setAttribute("aria-label", T_.next);
    }
    $("lang").addEventListener("click", function () {
      LANG = LANG === "en" ? "et" : "en"; save("tt-lang", LANG);
      applyLang(); render();
    });
    applyLang();
    window.addEventListener("resize", function () { render(); });
    render();
    setInterval(function () { if (!sheet.classList.contains("on")) { if (new Date().getDate() !== now.getDate()) { location.reload(); } else render(); } }, 60000);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/admin/tt/sw.js", { scope: "/admin/tt/" }).catch(function () {});
    }
  })();
  </script>
</body>
</html>
