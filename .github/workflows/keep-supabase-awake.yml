# Free Supabase projects get paused after ~7 days without activity, which
# breaks everything on the site that loads data. This pings the database every
# other day so it never counts as inactive. It only reads one row from a
# public table using the publishable key that is already in the site's source.
name: Keep Supabase awake

on:
  schedule:
    - cron: "41 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the projects table
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zrslvneipbgtivhlygfd.supabase.co/rest/v1/projects?select=*&limit=1" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}")
          echo "Supabase responded with HTTP $code"
          [ "$code" = "200" ]
        env:
          KEY: sb_publishable_3M5msWhxHlC7cOfY5X4NeQ_Lbc1bR3f
